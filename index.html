return[`Логическая функция F задана выражением ${t}. Ниже приведён фрагмент таблицы истинности функции F, содержащий неполный набор строк. Определите, какому столбцу таблицы соответствует каждая из переменных x, y, z.\n\nПерем. 1  Перем. 2  Перем. 3  F\n${D2.map(d=>d.cols.join("          ")+"          "+d.F).join("\n")}\n\nВ ответе запишите буквы переменных (латинские) в порядке столбцов, без пробелов и разделителей.`,ans,`Подставляем значения из строк в выражение и находим, какие переменные могут стоять в каждом столбце: единственное расположение, при котором F совпадает во всех строках, — ${ans}.`]}},
6(v){const a=ri(6,20),b=ri(6,20),c=v%3,A=a,B=a==b?b+1:b;
const sq=c==1;const pr=sq?`Повтори 4 [Вперёд ${a} Направо 90]`:c==0?`Повтори 2 [Вперёд ${A} Направо 90 Вперёд ${B} Направо 90]`:`Повтори 4 [Вперёд ${A} Направо 90 Вперёд ${B} Направо 90]`;
const r=sq?(a+1)**2:(A-1)*(B-1);
return[`Исполнитель Черепаха перемещается по плоскости, оставляя след в виде линии. Команды: Вперёд n (на n единиц в направлении движения), Направо m (поворот по часовой стрелке на m градусов). Запись Повтори k [команда1 команда2 …] означает, что последовательность в скобках выполняется k раз. Черепаха стоит в начале координат, хвост опущен, направлена вверх.\n\nВыполняется алгоритм:\n${pr}\n\nСколько точек с целочисленными координатами находится ${sq?"внутри фигуры и на её границе":"внутри фигуры (точки на границе не считать)"}?`,String(r),sq?`Фигура — квадрат ${a}×${a}. Точек на каждой стороне ${a+1}, всего (${a}+1)² = ${r}.`:`Фигура — прямоугольник ${A}×${B}${c==2?" (обведён дважды, фигура та же)":""}. Внутри: (${A}−1)·(${B}−1) = ${r}.`]}
};
const MC={};const mk=(t,v)=>MC[t*100+v]||(MC[t*100+v]=(()=>{R=mul(t*1009+v*7919);const[q,a,e]=G[t](v);return{t,v,q,a,e}})());
const eq=(u,a)=>{const x=norm(u).toLowerCase(),y=norm(a).toLowerCase();return x==y||(!y.includes(" ")&&x.replace(/ /g,"")==y)};
const norm=s=>String(s).trim().replace(/[\s,;]+/g," ");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const VS=Array.from({length:30},(_,i)=>i+1);

const h=x=>{$("#app").innerHTML=x;scrollTo(0,0)};
const I=(d,x="")=>`<svg viewBox="0 0 24 24" width="26" height="26" fill="#a995ff">${d}</svg>`;
const IC={dumb:I('<rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="8" y="11" width="8" height="2"/>'),
doc:I('<path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 11h8M8 14h8M8 17h5" stroke="#2a1f66" stroke-width="1.6" stroke-linecap="round"/>'),
cup:I('<path d="M7 3h10v5a5 5 0 0 1-10 0z"/><path d="M4 4h3v3a2 2 0 0 1-3-3zM20 4h-3v3a2 2 0 0 0 3-3zM11 13h2v4h3v2H8v-2h3z"/>'),
bars:I('<rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="16" y="9" width="4" height="11" rx="1"/>')};
const CH='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#8b6dff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const btn=(t,s,f,ic)=>`<button class="mi" onclick="${f}"><span class="ic">${IC[ic]}</span><span class="tx"><b>${t}</b><br><span class="mu">${s}</span></span>${CH}</button>`;
let Q=null,sel=new Set(TY),cnt=5;

function menu(){Q=null;h(`<h1>ЕГЭ · Информатика <span class="fl">💻</span></h1><div class="mu">Тренажёр: 23 типа заданий ЕГЭ</div><div style="height:10px"></div>`+
btn("Тренировка","Выбор типов, подсказки и разбор","setup()","dumb")+
btn("Экзамен","23 задания подряд. Больше 2 ошибок — провал","start('exam')","doc")+
btn("Марафон","92 задания подряд, в конце разбор слабых тем","start('mar')","cup")+
btn("Статистика","Прогресс по профилю","stats()","bars"))}

function setup(){h(`<button class="s" onclick="menu()">← Назад</button><h1>Тренировка</h1><h2>Типы заданий</h2><div class="chips">`+
TY.map(t=>`<button class="${sel.has(t)?"on":""}" onclick="tg(${t})">${t} · ${NM[t]}</button>`).join("")+
`</div><div style="height:8px"></div><button class="s" onclick="sel=sel.size==TY.length?new Set():new Set(TY);setup()">Выбрать все / сбросить</button>
<h2>Вариантов каждого типа: <span id="c">${cnt}</span></h2><input type="range" min="1" max="30" value="${cnt}" oninput="cnt=+this.value;upd()">
<button class="p" id="go" onclick="start('tr')"></button>`);upd()}
function tg(t){sel.has(t)?sel.delete(t):sel.add(t);setup()}
function upd(){$("#c").textContent=cnt;$("#go").textContent=`Начать · ${sel.size*cnt} ${((n,m=n%10,k=n%100)=>m==1&&k!=11?"задание":m>1&&m<5&&(k<12||k>14)?"задания":"заданий")(sel.size*cnt)}`}

function start(m){let l=[];
if(m=="tr"){if(!sel.size)return;for(const t of sel)for(const v of shuf(VS).slice(0,cnt))l.push([t,v])}
if(m=="exam")for(const t of TY)for(const v of shuf(VS).slice(0,1))l.push([t,v]);
if(m=="mar")for(const t of TY)for(const v of VS.slice(0,4))l.push([t,v]);
Q={m,l:m=="tr"?l.sort((x,y)=>x[0]-y[0]):shuf(l),i:0,err:0,e:{},h:[],v:0};show()}

function show(){view(Q.i)}
function bar(){if(Q.m=="exam")return`<div class="bar"><i style="width:${Q.i/Q.l.length*100}%"></i></div>`;return`<canvas id="sb" class="sb"></canvas>`}
function bindBar(){const cv=$("#sb");if(!cv)return;const n=Q.l.length,sg=n>30?3.5:1.6,R=Math.ceil(sg*1.6),gp=n>50?1:2,dp=Math.min(window.devicePixelRatio||1,2),W=cv.clientWidth,HH=64,c=cv.getContext("2d"),av=W-(n-1)*gp,u=av/n;
cv.width=W*dp;cv.height=HH*dp;c.scale(dp,dp);
const cw=Array(n).fill(u),ch=Array(n).fill(8),tw=Array(n).fill(u),th=Array(n).fill(8);let tx=[],hi=-1,anc=-9,act=false,raf=0;
const pos=()=>{let x=0;tx=tw.map(v=>{const p=x;x+=v+gp;return p})};pos();
const uni=()=>{tw.fill(u);th.fill(8);pos()};
const draw=()=>{c.clearRect(0,0,W,HH);let x=0,hx=0;
for(let i=0;i<n;i++){const h=ch[i],y=44-h/2,d=Q.h[i];c.fillStyle=d?(d.ok?"#5fdc94":"#ff6b81"):"rgba(255,255,255,.14)";c.fillRect(x,y,cw[i],h);
if(i==Q.v||i==hi){c.strokeStyle="#d6ccff";c.lineWidth=2;c.strokeRect(x-1,y-1,cw[i]+2,h+2)}
if(i==hi)hx=x+cw[i]/2;x+=cw[i]+gp}
if(hi>=0){const t=(hi+1)+(Q.h[hi]?(Q.h[hi].ok?" ✓":" ✗"):"");c.font="600 13px -apple-system,system-ui,sans-serif";const w=c.measureText(t).width+18,bx=Math.min(W-w,Math.max(0,hx-w/2));
c.fillStyle="#d6ccff";c.fillRect(bx,2,w,20);c.fillStyle="#0b0722";c.textAlign="center";c.textBaseline="middle";c.fillText(t,bx+w/2,12.5)}};
const frame=()=>{raf=0;let mv=false;for(let i=0;i<n;i++){const a=tw[i]-cw[i],b=th[i]-ch[i];if(Math.abs(a)>.05||Math.abs(b)>.05){cw[i]+=a*.4;ch[i]+=b*.4;mv=true}else{cw[i]=tw[i];ch[i]=th[i]}}draw();if(mv)req()};
const req=()=>{if(!raf)raf=requestAnimationFrame(frame)};
const at=x=>{for(let i=0;i<n;i++)if(x<tx[i]+tw[i]+gp/2)return[i,Math.min(.999,Math.max(.001,(x-tx[i])/tw[i]))];return[n-1,.999]};
const lay=(u0,x0)=>{const f=Math.min(n-1,Math.max(0,Math.floor(u0))),fr=Math.min(.999,Math.max(.001,u0-f)),g=[],w=[];let L=0,T=0;
for(let i=0;i<n;i++){const v=Math.exp(-((i+.5-u0)**2)/(2*sg*sg));g.push(v);w.push(1+7*v);T+=w[i];if(i<f)L+=w[i]}
L+=fr*w[f];const xp=Math.min(av-1,Math.max(1,x0-f*gp)),a=xp/L,b=(av-xp)/(T-L);
for(let i=0;i<n;i++){tw[i]=w[i]*(i<f?a:i>f?b:a*fr+b*(1-fr));th[i]=8+18*g[i]}pos();anc=f};

const rst=()=>{act=false;hi=-1;anc=-9;uni();req()};
cv.onpointerdown=mv;cv.onpointermove=e=>{if(e.pointerType=="mouse"||act)mv(e)};
cv.onpointerup=()=>{const i=hi;cancelAnimationFrame(raf);raf=0;rst();if(i>=0&&(Q.h[i]||i==Q.i))view(i)};
cv.onpointerleave=e=>{if(e.pointerType=="mouse")rst()};cv.onpointercancel=rst;draw()}
function inp(tr){return`<input type="text" id="a" placeholder="Ответ" autocomplete="off" autocapitalize="off"><button class="p" onclick="ans()">Ответить</button>${tr?`<button onclick="hint()">Подсказка</button><div id="hn" class="card mu" style="display:none"></div>`:""}`}
function res(i){const d=Q.h[i],c=i==Q.i,last=i>=Q.l.length-1||(Q.m=="exam"&&Q.err>2),mx=Q.h.length-1;
return`<div class="card${c?" an":""}"><span class="pi">${d.ok?"✅":"❌"}</span> <b class="${d.ok?"ok":"er"}">${d.ok?"Верно":"Неверно"}</b>${d.ok&&c&&Q.st>2?` <span class="pi" style="margin-left:8px">🔥 ${Q.st} подряд</span>`:""}<div class="mu" style="margin-top:6px">Ваш ответ: <b id="ua"></b></div>${d.ok?"":`<div>Правильный ответ: <b id="ca"></b></div>`}${Q.m=="tr"?`<div class="mu qt" id="ex" style="margin-top:8px"></div>`:""}</div>`+
(c?`<button class="p" onclick="next()">${last?"Завершить":"Дальше"}</button>`:`<div class="row"><button class="s" ${i?`onclick="view(${i-1})"`:"disabled"}>← Назад</button><button class="s" ${i<mx?`onclick="view(${i+1})"`:"disabled"}>Вперёд →</button></div><button class="p" style="margin-top:12px" onclick="view(Q.i)">К текущему заданию</button>`)}
function view(i){Q.v=i;const[t,v]=Q.l[i],k=Q.cur=mk(t,v),tr=Q.m=="tr",d=Q.h[i],rv=i!=Q.i;
h(`<div class="row"><button class="s" onclick="ask('Выйти из режима? Ответы уже сохранены в статистике.',menu,'Выйти')">✕</button><span class="mu">${i+1} / ${Q.l.length}${tr?"":" · ошибок: "+Q.err}</span></div>${bar()}${rv?`<div class="mu" style="margin-bottom:8px">Просмотр: ответ изменить нельзя</div>`:""}<div class="card" id="tc"><div class="mu">Задание ${t} · ${NM[t]}</div>${SN[t]?`<div class="mu" style="font-size:12px;opacity:.8">${SN[t]}</div>`:""}<div id="q" class="qt"></div></div><div id="ctl">${d?res(i):inp(tr)}</div>`);

function hint(){const b=$("#hn");b.textContent=H[Q.cur.t];b.style.display="block";b.classList.add("an")}

const ok=eq(u,k.a),r=S.t[k.t]=S.t[k.t]||[0,0];r[0]++;
if(!ok){r[1]++;Q.err++;Q.e[k.t]=(Q.e[k.t]||0)+1}sv();Q.st=ok?(Q.st||0)+1:0;Q.h[Q.i]={u:u.trim(),ok};

function fin(){const n=Q.i+1,m=Q.m,rows=Object.entries(Q.e).sort((a,b)=>b[1]-a[1]);let t,s;
if(m=="exam"){const ps=Q.err<=2&&n==Q.l.length;t=ps?"Экзамен сдан":"Экзамен не сдан";s=`Решено ${n} из ${Q.l.length}, ошибок: ${Q.err}`+(ps?"":". Допустимо не больше 2.")}
else if(m=="mar"){t="Марафон пройден";s=`Ошибок: ${Q.err} из ${n}`}
else{t="Тренировка завершена";s=`Верно ${n-Q.err} из ${n}`}
const em=m=="exam"?(Q.err<=2&&n==Q.l.length?"🎉":"💪"):m=="mar"?(Q.err?"🏁":"🏆"):(Q.err?"📘":"⭐");if(em=="🎉"||em=="🏆"||em=="⭐")setTimeout(conf,200);
const rec=m=="tr"?"":(rows.length?`<h2>Где больше всего проблем</h2>`+rows.slice(0,3).map(([k,e])=>`<div class="card"><b>№${k} · ${NM[k]}</b><div class="er">ошибок: ${e}</div><div class="mu" style="margin-top:6px">Рекомендация: потренируйтесь в режиме «Тренировка» именно на этом типе. ${H[k]}</div></div>`).join(""):`<div class="card ok">Ошибок нет. Отличный результат.</div>`);
h(`<div class="fl" style="font-size:56px;margin-top:8px">${em}</div><h1>${t}</h1><div class="mu">${s}</div>${rec}<button class="p" onclick="menu()">В меню</button>`)}

function stats(){const E=Object.entries(S.t);let tot=0,w=0;E.forEach(([_,r])=>{tot+=r[0];w+=r[1]});
const q=E.filter(([_,r])=>r[0]>=3).map(([t,r])=>[t,r[1]/r[0]]).sort((a,b)=>b[1]-a[1]);
const blk=(k,v)=>`<div style="padding:6px 0"><div class="mu">${k}</div><b>${v}</b></div>`,fm=x=>`№${x[0]} · ${NM[x[0]]}, ошибок ${Math.round(x[1]*100)}%`,few=q.length<2;
h(`<button class="s" onclick="menu()">← Назад</button><h1>Статистика</h1><div class="card">`+
blk("Решено заданий",tot)+blk("Верных ответов",tot?Math.round(100*(tot-w)/tot)+"%":"—")+
blk("Время в приложении",`${Math.floor(S.sec/3600)} ч ${Math.floor(S.sec%3600/60)} мин`)+
blk("Самое проблемное",few?"пока мало данных (нужно от 3 ответов в двух типах)":fm(q[0]))+
blk("Без вопросов",few?"пока мало данных":fm(q[q.length-1]))+`</div><h2>Верные ответы по типам</h2>`+
TY.map(t=>{const r=S.t[t]||[0,0],p=r[0]?Math.round(100*(r[0]-r[1])/r[0]):0;return`<div class="row"><span class="mu">№${t} · ${NM[t]}</span><span>${r[0]?p+"%":"—"}</span></div><div class="bar"><i style="width:${p}%"></i></div>`}).join("")+
`<button onclick="ask('Стереть всю статистику?',()=>{S={t:{},sec:0};sv();stats()},'Стереть')">Сбросить статистику</button>`)}
menu();
</script></body></html>
